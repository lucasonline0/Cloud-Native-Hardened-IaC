apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-proxy
  namespace: default
  labels:
    app: waf-proxy
    tier: frontend
spec:
  replicas: 2 # High Availability (HA) starts at 2
  selector:
    matchLabels:
      app: waf-proxy
  template:
    metadata:
      labels:
        app: waf-proxy
    spec:
      securityContext:
        runAsUser: 101       # Run as 'nginx' user, not root
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: nginx-secure
        image: nginxinc/nginx-unprivileged:alpine
        imagePullPolicy: IfNotPresent
        
        # Hardened Security Context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true # Attacker cannot write to disk
          capabilities:
            drop:
              - ALL # Drop all Linux capabilities (Ping, Net_Raw, etc.)
            add:
              - NET_BIND_SERVICE # Only allow binding to ports

        ports:
        - containerPort: 8080 # Unprivileged Nginx uses 8080, not 80
          name: http
          protocol: TCP

        # Quality of Service (QoS): Guaranteed
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"

        # Health Checks (Self-Healing)
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5

        # Volume required because root fs is Read-Only
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /var/cache/nginx
          name: cache-volume
        - mountPath: /var/run
          name: run-volume

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: cache-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}
