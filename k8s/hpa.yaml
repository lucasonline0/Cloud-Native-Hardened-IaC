apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waf-proxy-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waf-proxy
  minReplicas: 2  # Always maintain HA
  maxReplicas: 10 # Burst capacity
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Scale up if CPU > 50%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70 # Scale up if Memory > 70%
